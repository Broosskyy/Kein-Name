name: Unpack M10.3 Source

on:
  push:
    branches: [main]
    paths:
      - 'Mutation_Boss_M10_3_Source.part01'
      - 'Mutation_Boss_M10_3_Source.part02'
      - '.github/workflows/unpack-m05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble M10.3 ZIP
        run: |
          cat Mutation_Boss_M10_3_Source.part01               Mutation_Boss_M10_3_Source.part02               > /tmp/Mutation_Boss_M10_3_Source.zip
          echo "d2d0960379c6e025b52da7c8b04520e5bd1ac186c8aeae4fd92b2899230a8523  /tmp/Mutation_Boss_M10_3_Source.zip" | sha256sum -c -
          unzip -t /tmp/Mutation_Boss_M10_3_Source.zip >/dev/null

      - name: Unpack exact M10.3 source
        run: |
          rm -rf /tmp/m10_3
          mkdir -p /tmp/m10_3
          unzip -q /tmp/Mutation_Boss_M10_3_Source.zip -d /tmp/m10_3

          ROOT="/tmp/m10_3"
          DIR_COUNT=$(find /tmp/m10_3 -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILE_COUNT=$(find /tmp/m10_3 -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            ROOT=$(find /tmp/m10_3 -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi

          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='Mutation_Boss_M10_3_Source.part01'             --exclude='Mutation_Boss_M10_3_Source.part02'             "$ROOT"/ ./

          rm -f Mutation_Boss_M10_3_Source.part01
          rm -f Mutation_Boss_M10_3_Source.part02

          test -f package.json
          test -f M10_3_VISUAL_COHERENCE_DIRECTIONAL_REBUILD.md
          test -f src/world3d/HybridWorldRenderer.ts
          test -f src/world3d/HybridCameraController.ts
          test -f public/assets/boss/directional/harvest-colossus-front.webp
          test -f public/assets/boss/directional/harvest-colossus-rear.webp
          test -f public/assets/creature/directional/creature-n-idle.webp
          grep -q '"version": "1.0.3"' package.json

      - name: Install and validate
        run: |
          npm ci
          npx tsc -b --pretty false
          npm test -- --run
          npm run build

      - name: Keep repository source-clean
        run: |
          rm -rf node_modules
          rm -rf dist
          rm -f /tmp/Mutation_Boss_M10_3_Source.zip

      - name: Commit unpacked M10.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Unpack and validate M10.3 source"
          git pull --rebase origin main
          git push
