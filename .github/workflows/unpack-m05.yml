name: Unpack M05 Source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-m05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack M05 source
        run: |
          unzip -o Mutation_Boss_M05_Source.zip -d .
          rm Mutation_Boss_M05_Source.zip
      - name: Commit unpacked source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Unpack M05 source"
          git push
